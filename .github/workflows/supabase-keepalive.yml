# Mantiene vivo el free tier de Supabase (pausa ~7 días sin actividad).
#
# Secret del repo: SUPABASE_DB_URL
# Preferido (Npgsql):
#   Host=aws-1-eu-west-3.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.gzcrrlazcodfhhjjntmn;Password=TU_PASSWORD;SSL Mode=Require;Trust Server Certificate=true
# También URI:
#   postgresql://postgres.gzcrrlazcodfhhjjntmn:PASSWORD@aws-1-eu-west-3.pooler.supabase.com:5432/postgres

name: Supabase keepalive

on:
  schedule:
    - cron: "0 6 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Build connection info
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 .github/scripts/supabase_conninfo.py

      - name: Ping database
        run: psql "$PG_CONNINFO" -v ON_ERROR_STOP=1 -c "select 1 as keep_alive, now() as at;"
