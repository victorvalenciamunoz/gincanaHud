# Mantiene vivo el free tier de Supabase.
# Un ping no basta: cada run hace un burst de queries SQL (+ REST si hay secrets).
#
# Secrets (GitHub → Settings → Secrets):
#   SUPABASE_DB_URL (obligatorio) — connection string del session pooler (Npgsql o URI)
#   SUPABASE_URL + SUPABASE_ANON_KEY (recomendable) — ping REST

name: Supabase keepalive

on:
  schedule:
    # Diario 06:00 UTC + manual. La cantidad de actividad va en el script (burst).
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Keepalive burst
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 .github/scripts/supabase_conninfo.py
