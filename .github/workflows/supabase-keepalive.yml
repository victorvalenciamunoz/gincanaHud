# Mantiene vivo el free tier de Supabase.
# Un ping no basta: cada run hace un burst de queries SQL (+ REST si hay secrets).
#
# Secrets:
#   SUPABASE_DB_URL (obligatorio)
#   SUPABASE_URL + SUPABASE_ANON_KEY (muy recomendable — actividad vía PostgREST)
#
# Ejemplo Npgsql:
#   Host=aws-1-eu-west-3.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.gzcrrlazcodfhhjjntmn;Password=...;SSL Mode=Require;Trust Server Certificate=true

name: Supabase keepalive

on:
  schedule:
    # Diario 06:00 UTC + manual. La cantidad de actividad va en el script (burst).
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Keepalive burst
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 .github/scripts/supabase_conninfo.py
