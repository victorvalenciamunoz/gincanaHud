# Compila y pasa los tests en cada pull request y en main (fase 13, D23).
# La app MAUI no está en la solución: se compila aparte.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: .NET (versión de global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (avisos como errores)
        run: dotnet build GincanaHud.slnx -c Release -warnaserror

      - name: Tests
        run: dotnet test --solution GincanaHud.slnx -c Release --no-build
